name: Construir APK Grafiplot administrador y local
on:
  push:
    branches: [main, 'codex/informes-apk']
    paths: ['native/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p native/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Grafiplot-Local-Android
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Grafiplot-Administrador-Android
          path: native/android/admin/build/outputs/apk/debug/admin-debug.apk
          retention-days: 90
